services:
  postgres:
    image: postgres:16-alpine
    container_name: event-modeler-postgres
    environment:
      POSTGRES_USER: event_modeler
      POSTGRES_PASSWORD: event_modeler
      POSTGRES_DB: event_modeler
    ports:
      - "5432:5432"
    volumes:
      - event-modeler-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_modeler"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  event-modeler-pgdata:
